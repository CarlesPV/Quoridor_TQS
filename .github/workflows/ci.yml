# Pipeline de Integración Continua (CI) para Quoridor_TQS
# Ejecuta automáticamente la compilación, los tests unitarios, el análisis de cobertura (JaCoCo)
# y la comprobación de calidad de código (Checkstyle) antes de integrar cambios en master.
name: Java CI - Tests & Code Quality

on:
  # Se activa al subir commits a la rama principal o a las ramas de desarrollo
  push:
    branches:
      - master
      - 'feature/**'
      - 'fix/**'
      - 'refactor/**'
  # Se activa al abrir o actualizar un Pull Request dirigido a la rama principal master
  pull_request:
    branches:
      - master

jobs:
  build-test-quality:
    name: Compilación, Tests y Checkstyle (Java 21)
    runs-on: ubuntu-latest

    steps:
      # 1. Descarga el código del repositorio en el entorno de ejecución
      - name: Checkout del código fuente
        uses: actions/checkout@v4

      # 2. Configura el entorno de JavaSE-21 (Eclipse Temurin) y activa la caché de dependencias Maven
      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # 3. Verifica que tanto el código de producción como el de pruebas compilen sin errores
      - name: Compilar proyecto y código de pruebas
        run: mvn -B clean test-compile

      # 4. Ejecuta todos los tests unitarios (JUnit 5 con -ea activado) y genera el informe de cobertura JaCoCo.
      #    Si algún test falla, la acción termina con error y bloquea el merge a master.
      - name: Ejecutar pruebas unitarias y generar reporte de cobertura (JaCoCo)
        run: mvn -B test

      # 5. Verifica la calidad del código frente a las normas definidas en checkstyle.xml.
      #    Si se detecta cualquier infracción (ej. longitud de línea > 120), falla y bloquea el merge.
      - name: Comprobar calidad y estilo del código (Checkstyle)
        run: mvn -B checkstyle:check

      # 6. Guarda el reporte HTML/XML de cobertura generado por JaCoCo como artefacto descargable
      - name: Publicar reporte de cobertura JaCoCo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: target/site/jacoco/
          if-no-files-found: ignore

